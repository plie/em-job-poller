name: Poll EM job boards

on:
  schedule:
    # 11:30 UTC = 6:30am Central (CDT). Adjust after the DST change if you care.
    - cron: "30 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python poll.py
      - name: Commit results
        run: |
          git config user.name "em-job-poller"
          git config user.email "poller@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "poll: $(date -u +%Y-%m-%d)"
          git push
